name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBwIeq5R7X9lX__cLwWIEGIdroC4UNyMEQ
          VITE_FIREBASE_AUTH_DOMAIN: dhanatrack.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: dhanatrack
          VITE_FIREBASE_STORAGE_BUCKET: dhanatrack.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 930404863668
          VITE_FIREBASE_APP_ID: 1:930404863668:web:df173e303d7d92da9ad1e1
          VITE_FIREBASE_MEASUREMENT_ID: G-0HNRGZ3XM2

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
